# ssh-key-only-access: sshd accepts public-key logins of the named users and nothing else.
# Needs JailOps >= 0.9.5 and a jail with FreeBSD-ssh:  jailops jail base add NAME FreeBSD-ssh
#   jailops jail apply NAME -f recipes/ssh-key-only-access/ --vars my.vars
# It owns /etc/ssh/sshd_config as a whole (the previous file is kept once next to it). The keys are read from
# ${keys_dir}/USER, the file that admin-user-with-ssh-key writes.
vars:
  allowed_users:    {required: true, split: true}       # who may log in: a list separated by spaces
  permit_root_login: {default: "no"}                    # "no", or "prohibit-password" with root in allowed_users
  port:             {default: 22}
  keys_dir:         {default: /usr/local/etc/ssh/authorized_keys}
steps:
  # no lock-out: every named user must already have a valid public key in the key directory, or nothing is changed.
  # The recipe never writes a key file itself, so a key cannot be replaced from here.
  - run:
      - sh
      - -c
      - |
        k=$1; shift
        for u; do ssh-keygen -l -f "$k/$u" > /dev/null 2>&1 || { echo "ssh-key-only-access: $u has no valid public key in $k/$u, password logins stay on (apply admin-user-with-ssh-key first)" >&2; exit 1; }; done
      - sh
      - "${keys_dir}"
      - "${allowed_users}"

  # keep the file that was there, once, before the recipe replaces it
  - run: [cp, -p, /etc/ssh/sshd_config, /etc/ssh/sshd_config.before-key-only-access]
    creates: /etc/ssh/sshd_config.before-key-only-access

  # host keys that are missing (sshd -t refuses to start without one); existing ones are never replaced
  - run: [ssh-keygen, -A]
    creates: /etc/ssh/ssh_host_ed25519_key

  - file:
      path: /etc/ssh/sshd_config
      source: files/sshd_config
      template: true

  # sshd -t reads the file: a broken one stops the recipe before sshd sees it
  - run: [/usr/sbin/sshd, -t]

  - service: {name: sshd, enabled: true, running: true}

  # a running sshd re-reads its file on reload and open sessions stay. No guard: it runs at every apply ("executed")
  - run: [service, sshd, reload]
