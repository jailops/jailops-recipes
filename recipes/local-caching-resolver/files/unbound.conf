# Resolver for one client network, written by the recipe local-caching-resolver.
# Zones and your own settings: files ending in .conf in /usr/local/etc/unbound/conf.d.
server:
    directory: "/usr/local/etc/unbound"
    username: unbound
    # inside a jail the jail is the sandbox: no chroot of its own
    chroot: ""
    use-syslog: yes
    verbosity: 1

    interface: ${listen_address}
    port: 53
    do-ip6: no

    # who may ask: this jail and the client network; everybody else is refused
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: ${client_network} allow

    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    qname-minimisation: yes
    prefetch: yes
    auto-trust-anchor-file: "/usr/local/etc/unbound/root.key"

include-toplevel: "/usr/local/etc/unbound/conf.d/*.conf"
