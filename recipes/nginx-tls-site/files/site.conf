# Site ${site}, written by the recipe nginx-tls-site.
server {
    listen ${listen_address}:80;
    server_name ${site} ${server_aliases};
    return 301 https://${site}$request_uri;
}

server {
    listen ${listen_address}:443 ssl;
    http2 on;
    server_name ${site} ${server_aliases};

    ssl_certificate     ${ssl_dir}/${site}.crt;
    ssl_certificate_key ${ssl_dir}/${site}.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root ${web_root};
    index index.html;
}
